<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAMLAH — Order Meja</title>
  <meta name="description" content="Pesan menu MAMLAH dari meja Anda" />
  <style>
    :root{--red:#c90000;--yellow:#ffe06a;--ink:#271313;--cream:#fffaf0;--muted:#836e6e;--line:#eadbce}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8ee,#fff);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1060px;margin:auto;padding:20px 16px 100px}.brand{display:flex;align-items:center;gap:12px}.mark{width:52px;height:52px;border-radius:15px;background:var(--red);display:grid;place-items:center;color:var(--yellow);font-weight:1000;font-size:34px;line-height:1}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;color:var(--red)}h1{font-size:clamp(28px,6vw,50px);line-height:.98;margin:18px 0 8px;max-width:650px;letter-spacing:-.05em}.sub{color:var(--muted);font-size:14px;max-width:560px}.table-pill{display:inline-flex;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;margin-top:25px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 16px 45px #8d310d0b}.panel h2{font-size:16px;margin:0 0 14px}.toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input{flex:1}.categories{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff8f1;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900}.chip.active{background:var(--red);border-color:var(--red);color:#fff}.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.menu{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fffaf6;display:flex;flex-direction:column;gap:8px;min-height:175px}.menu strong{font-size:13px;line-height:1.15}.price{color:var(--red);font-weight:1000;font-size:14px}.menu small{color:var(--muted);line-height:1.3;flex:1}.add{border:0;background:var(--red);color:#fff;border-radius:11px;padding:10px;font-size:12px;font-weight:900}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}.field label{font-size:11px;font-weight:900}.field input,.field select,.field textarea,.toolbar input{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;font-size:13px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus{border-color:var(--red);box-shadow:0 0 0 3px #c9000014}.required{color:var(--red)}.cart{display:flex;flex-direction:column;gap:9px;margin:12px 0 16px}.cart-empty{padding:20px 10px;color:var(--muted);font-size:12px;text-align:center;border:1px dashed var(--line);border-radius:13px}.cart-row{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #f1e8df;padding-bottom:9px}.cart-row strong{font-size:12px}.cart-row small{display:block;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:25px;height:25px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:900}.total{display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding-top:12px;font-size:17px;font-weight:1000}.submit{width:100%;border:0;background:var(--red);color:#fff;border-radius:14px;padding:14px;font-weight:1000;margin-top:15px}.submit:disabled{opacity:.45;cursor:not-allowed}.notice{padding:12px;border-radius:12px;font-size:12px;margin-bottom:12px;background:#fff4ce;color:#6a4f00}.success{background:#e8f8e9;color:#195d27}.error{background:#ffe9e9;color:#8b1111}.hidden{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel.sticky{position:static}}@media(max-width:420px){.shell{padding:15px 11px 80px}.menu-grid{gap:8px}.menu{padding:10px;min-height:165px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><div class="mark">M</div><div><div class="eyebrow">MAMLAH</div><div style="font-weight:900;font-size:13px">Solusi Kelaparan</div></div></div><div class="table-pill" id="tableLabel">Memuat meja...</div><h1>Pesan langsung dari meja Anda.</h1><p class="sub">Pilih menu, tulis catatan, lalu isi nama dan WhatsApp agar tim kami mudah menghubungi Anda jika ada kendala pesanan.</p></header>
    <div id="notice" class="notice hidden"></div>
    <section class="layout">
      <div class="panel"><h2>Menu MAMLAH</h2><div class="toolbar"><input id="search" placeholder="Cari menu..." autocomplete="off" /></div><div id="categories" class="categories"></div><div id="menus" class="menu-grid"></div></div>
      <aside class="panel sticky"><h2>Pesanan Anda</h2><div id="cart" class="cart"></div><div class="total"><span>Total</span><span id="total">Rp0</span></div><form id="orderForm"><div class="field"><label>Nama <span class="required">*</span></label><input id="customerName" required minlength="2" placeholder="Nama Anda" /></div><div class="field"><label>Nomor WhatsApp <span class="required">*</span></label><input id="whatsapp" required inputmode="tel" placeholder="08xxxxxxxxxx" /></div><div class="field"><label>Tipe pesanan</label><select id="orderType"><option value="DINE IN">Makan di tempat</option><option value="TAKE AWAY">Take away</option><option value="DELIVERY">Diantar</option></select></div><div id="deliveryFields" class="hidden"><div class="field"><label>Diantar via</label><select id="deliveryMethod"><option value="Kurir toko">Kurir toko</option><option value="Ojol">Ojol</option><option value="Ambil sendiri">Ambil sendiri</option></select></div><div class="field"><label>Alamat pengantaran <span class="required">*</span></label><textarea id="address" rows="2" placeholder="Alamat lengkap"></textarea></div></div><div class="field"><label>Catatan umum</label><textarea id="note" rows="2" placeholder="Contoh: saus dipisah"></textarea></div><button class="submit" id="submit" type="submit">Kirim Pesanan</button></form></aside>
    </section>
  </main>
<script>
const SUPABASE_URL='https://qbdcformrfsbvtiwwznl.supabase.co';
const SUPABASE_KEY='sb_publishable__X7EDhHWpADgBKKZ_1DtUQ_LkKDS-4w';
const params=new URLSearchParams(location.search); const tableCode=params.get('table')||params.get('meja')||'t1';
const state={menus:[],categories:['Semua'],category:'Semua',cart:[]};
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const api=async(path,options={})=>{const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()};
function notice(text,type=''){const el=document.getElementById('notice');el.textContent=text;el.className='notice '+type;el.classList.remove('hidden');}
function renderMenus(){const q=document.getElementById('search').value.toLowerCase();document.getElementById('categories').innerHTML=state.categories.map(c=>`<button class="chip ${c===state.category?'active':''}" onclick="setCategory('${c.replaceAll("'","\\'")}')">${c}</button>`).join('');const list=state.menus.filter(m=>(state.category==='Semua'||m.category===state.category)&&m.name.toLowerCase().includes(q));document.getElementById('menus').innerHTML=list.length?list.map(m=>`<article class="menu"><strong>${m.name}</strong><span class="price">${money(m.price)}</span><small>${m.description||'Menu pilihan MAMLAH'}</small><button class="add" onclick="add('${m.id}')">Tambah</button></article>`).join(''):'<div class="cart-empty" style="grid-column:1/-1">Menu belum tersedia atau tidak ditemukan.</div>';}
function renderCart(){const box=document.getElementById('cart');box.innerHTML=state.cart.length?state.cart.map((x,i)=>`<div class="cart-row"><div><strong>${x.name}</strong><small>${money(x.price)} · ${x.note||'Tanpa catatan'}</small></div><div class="qty"><button type="button" onclick="change(${i},-1)">−</button><b>${x.qty}</b><button type="button" onclick="change(${i},1)">+</button></div></div>`).join(''):'<div class="cart-empty">Belum ada menu. Pilih menu untuk mulai.</div>';document.getElementById('total').textContent=money(state.cart.reduce((s,x)=>s+x.price*x.qty,0));document.getElementById('submit').disabled=!state.cart.length;}
function setCategory(c){state.category=c;renderMenus()} function add(id){const m=state.menus.find(x=>x.id===id);if(!m)return;const note=prompt(`Catatan untuk ${m.name} (opsional):`)||'';const x=state.cart.find(x=>x.menuId===id&&x.note===note);if(x)x.qty++;else state.cart.push({menuId:m.id,name:m.name,price:Number(m.price)||0,qty:1,note});renderCart()} function change(i,d){state.cart[i].qty+=d;if(state.cart[i].qty<=0)state.cart.splice(i,1);renderCart()}
document.getElementById('search').oninput=renderMenus;document.getElementById('orderType').onchange=e=>document.getElementById('deliveryFields').classList.toggle('hidden',e.target.value!=='DELIVERY');
document.getElementById('orderForm').onsubmit=async e=>{e.preventDefault();if(!state.cart.length)return;const type=document.getElementById('orderType').value;const address=document.getElementById('address').value.trim();if(type==='DELIVERY'&&!address){notice('Alamat pengantaran wajib diisi.','error');return}const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Mengirim...';try{const total=state.cart.reduce((s,x)=>s+x.price*x.qty,0);await api('qr_orders',{method:'POST',body:JSON.stringify({table_code:tableCode,customer_name:document.getElementById('customerName').value.trim(),customer_whatsapp:document.getElementById('whatsapp').value.trim(),order_type:type,delivery_method:type==='DELIVERY'?document.getElementById('deliveryMethod').value:null,delivery_address:type==='DELIVERY'?address:null,note:document.getElementById('note').value.trim(),items:state.cart,subtotal:total,total,status:'PENDING'})});notice('Pesanan berhasil dikirim. Tim MAMLAH akan memeriksa pesanan Anda.','success');state.cart=[];renderCart();e.target.reset();document.getElementById('deliveryFields').classList.add('hidden')}catch(err){console.error(err);notice('Pesanan belum terkirim. Silakan coba lagi atau hubungi kasir.','error')}finally{btn.disabled=!state.cart.length;btn.textContent='Kirim Pesanan'}};
(async()=>{try{const tables=await api('qr_tables?select=code,name&code=eq.'+encodeURIComponent(tableCode));document.getElementById('tableLabel').textContent=tables[0]?tables[0].name:'Meja '+tableCode.replace(/\D/g,'');const menus=await api('qr_menu_items?select=id,name,description,price,category,active&active=eq.true&order=name');state.menus=menus;state.categories=['Semua',...new Set(menus.map(m=>m.category).filter(Boolean))];renderMenus();renderCart()}catch(e){console.error(e);document.getElementById('tableLabel').textContent='Meja '+tableCode.replace(/\D/g,'');notice('Menu online belum tersambung. Pastikan katalog QR sudah dipublikasikan dari aplikasi kasir.','error');renderCart()}})();
</script></body></html>
