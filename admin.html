<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAMLAH Admin Menu</title>
<style>
:root{--red:#c90000;--yellow:#ffe06a;--ink:#271313;--muted:#806d6d;--line:#eadbd0;--cream:#fff9ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8ed,#fff);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:24px 16px 80px}.brand{display:flex;align-items:center;gap:10px}.mark{width:46px;height:46px;border-radius:14px;background:var(--red);color:var(--yellow);display:grid;place-items:center;font-weight:1000;font-size:30px}.eyebrow{color:var(--red);font-size:11px;font-weight:1000;letter-spacing:.16em}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.btn{border:0;border-radius:11px;padding:10px 14px;font-size:12px;font-weight:900}.primary{background:var(--red);color:#fff}.soft{background:#fff3df;color:#7d3f00;border:1px solid #f0d4af}.danger{background:#fff0f0;color:#a10e0e;border:1px solid #f3c2c2}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 38px #79220b0d}.login{max-width:420px;margin:10vh auto}.h1{font-size:28px;letter-spacing:-.04em;margin:5px 0 7px}.muted{color:var(--muted);font-size:13px}.field{display:flex;flex-direction:column;gap:5px;margin:11px 0}.field label{font-size:11px;font-weight:900}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;width:100%;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red);box-shadow:0 0 0 3px #c9000014}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:210px;border:1px solid var(--line);border-radius:11px;padding:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fffdfa}.cardhead{display:flex;justify-content:space-between;gap:9px;align-items:start}.card h3{font-size:14px;margin:0 0 3px}.badge{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;background:#e9faeb;color:#24632a}.badge.off{background:#fff0f0;color:#9d2222}.thumb{height:120px;border-radius:12px;background:#fff4e5;display:grid;place-items:center;overflow:hidden;margin:10px 0}.thumb img{width:100%;height:100%;object-fit:cover}.thumb span{font-size:11px;color:#a58268}.money{color:var(--red);font-weight:1000;font-size:15px}.row{display:flex;gap:7px}.row>*{flex:1}.group{border:1px dashed #dfcabb;border-radius:13px;padding:11px;margin:10px 0;background:#fffaf5}.grouphead{display:flex;justify-content:space-between;align-items:center}.group h4{font-size:12px;margin:0}.option{display:grid;grid-template-columns:1fr 115px 30px;gap:6px;margin-top:7px}.option input{border:1px solid var(--line);border-radius:8px;padding:7px;font-size:12px}.empty{text-align:center;padding:40px;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#195d27;color:#fff;padding:12px 15px;border-radius:11px;font-size:12px;font-weight:800;box-shadow:0 8px 30px #0002;z-index:4}.error{background:#fff0f0;color:#941b1b;border:1px solid #f2c3c3;padding:10px;border-radius:10px;font-size:12px}.modal{position:fixed;inset:0;background:#25121266;display:grid;place-items:center;padding:16px;z-index:3}.modalbox{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:18px}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.top .row{width:100%}.top .row button{flex:1}}
</style></head>
<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL='https://qbdcformrfsbvtiwwznl.supabase.co',KEY='sb_publishable__X7EDhHWpADgBKKZ_1DtUQ_LkKDS-4w';const sb=supabase.createClient(URL,KEY);let menus=[],editing=null;
const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toast(t){const x=$('#toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2600)}
function login(){app.innerHTML=`<main class="wrap"><section class="panel login"><div class="brand"><div class="mark">M</div><div><div class="eyebrow">MAMLAH ADMIN</div><b>Dashboard Menu QR</b></div></div><h1 class="h1">Masuk ke pengaturan</h1><p class="muted">Gunakan email/password akun Supabase admin. Halaman ini tidak bisa diakses pelanggan.</p><div id="loginError" class="error hidden"></div><form id="loginForm"><div class="field"><label>Email Admin</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%">Masuk</button></form></section></main>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){$('#loginError').textContent=error.message;$('#loginError').classList.remove('hidden')}}}
function shell(){app.innerHTML=`<main class="wrap"><header class="top"><div class="brand"><div class="mark">M</div><div><div class="eyebrow">MAMLAH ADMIN</div><b>Dashboard Menu QR</b></div></div><div class="row"><button class="btn soft" id="refresh">Refresh</button><button class="btn danger" id="logout">Keluar</button></div></header><section class="panel"><div class="top" style="margin-bottom:14px"><div><h1 class="h1">Katalog Menu</h1><p class="muted">Atur harga, foto, ketersediaan, varian, add-on, dan catatan yang tampil di QR.</p></div><button class="btn primary" id="new">+ Tambah Menu</button></div><div class="toolbar"><input id="search" placeholder="Cari nama atau kategori menu..."><select id="filter"><option value="all">Semua status</option><option value="active">Aktif</option><option value="off">Sold out</option></select></div><div id="grid" class="grid"></div></section></main>`;$('#refresh').onclick=load;$('#logout').onclick=()=>sb.auth.signOut();$('#new').onclick=()=>openEditor(null);$('#search').oninput=render;$('#filter').onchange=render;load()}
function render(){const q=($('#search')?.value||'').toLowerCase(),f=$('#filter')?.value||'all';const list=menus.filter(m=>(f==='all'||(f==='active'?m.active:!m.active))&&(`${m.name} ${m.category||''}`.toLowerCase().includes(q)));$('#grid').innerHTML=list.length?list.map(m=>`<article class="card"><div class="cardhead"><div><h3>${esc(m.name)}</h3><div class="muted">${esc(m.category||'Tanpa kategori')}</div></div><span class="badge ${m.active?'':'off'}">${m.active?'AKTIF':'SOLD OUT'}</span></div><div class="thumb">${m.image?`<img src="${esc(m.image)}" onerror="this.remove();this.parentNode.innerHTML='<span>Foto gagal dimuat</span>'">`:'<span>Belum ada foto</span>'}</div><div class="money">${money(m.price)}</div><p class="muted">${esc(m.description||'Tidak ada deskripsi')}</p><button class="btn soft" style="width:100%" onclick="openEditor('${esc(m.id)}')">Edit Menu & Varian</button></article>`).join(''):'<div class="empty" style="grid-column:1/-1">Belum ada menu. Klik Tambah Menu.</div>'}
async function load(){const{data,error}=await sb.from('qr_menu_items').select('*').order('name');if(error){toast(error.message);return}menus=data||[];render()}
function groupHTML(g,i){return `<div class="group" data-group="${i}"><div class="grouphead"><h4>Grup ${i+1}</h4><button type="button" class="btn danger removeGroup">Hapus grup</button></div><div class="field"><label>Nama grup (contoh: Level Pedas / Pilihan Nasi)</label><input class="gname" value="${esc(g.name||'')}" placeholder="Nama pilihan"></div><label class="muted"><input type="checkbox" class="grequired" ${g.required?'checked':''}> Wajib dipilih</label><div class="options">${(g.options||[]).map((o,j)=>`<div class="option"><input class="oname" value="${esc(o.name||'')}" placeholder="Nama pilihan"><input class="oprice" type="number" min="0" value="${Number(o.price)||0}" placeholder="Tambah harga"><button type="button" class="btn danger removeOption">×</button></div>`).join('')}</div><button type="button" class="btn soft addOption">+ Tambah opsi</button></div>`}
function openEditor(id){editing=menus.find(m=>m.id===id)||{id:'menu-'+Date.now(),name:'',description:'',category:'',price:0,active:true,image:'',option_groups:[]};const groups=Array.isArray(editing.option_groups)?editing.option_groups:[];document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><section class="modalbox"><div class="modalhead"><h2>${id?'Edit Menu':'Tambah Menu'}</h2><button class="btn soft" id="close">Tutup</button></div><form id="editForm"><div class="field"><label>Nama menu</label><input id="mname" required value="${esc(editing.name)}"></div><div class="row"><div class="field"><label>Kategori</label><input id="mcat" value="${esc(editing.category||'')}"></div><div class="field"><label>Harga jual</label><input id="mprice" type="number" min="0" required value="${Number(editing.price)||0}"></div></div><div class="field"><label>URL foto menu</label><input id="mimage" type="url" value="${esc(editing.image||'')}" placeholder="https://..."></div><div class="field"><label>Deskripsi / catatan menu</label><textarea id="mdesc" rows="2">${esc(editing.description||'')}</textarea></div><label class="muted"><input id="mactive" type="checkbox" ${editing.active!==false?'checked':''}> Menu tersedia di QR</label><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><div class="top" style="margin:0 0 8px"><div><b>Varian & Add-on</b><div class="muted">Contoh: Level Pedas, pilihan nasi, extra saus.</div></div><button type="button" class="btn soft" id="addGroup">+ Tambah Grup</button></div><div id="groups">${groups.map(groupHTML).join('')}</div><div class="row" style="margin-top:18px"><button type="button" class="btn danger" id="delete">Hapus Menu</button><button class="btn primary" style="flex:2">Simpan Menu</button></div></form></section></div>`);$('#close').onclick=()=>$('#modal').remove();$('#addGroup').onclick=()=>{$('#groups').insertAdjacentHTML('beforeend',groupHTML({name:'',required:false,options:[]},document.querySelectorAll('.group').length));bindGroups()};$('#delete').onclick=async()=>{if(!id||!confirm('Hapus menu ini dari katalog QR?'))return;const{error}=await sb.from('qr_menu_items').delete().eq('id',id);if(error)toast(error.message);else{$('#modal').remove();toast('Menu dihapus');load()}};bindGroups();$('#editForm').onsubmit=save}
function bindGroups(){document.querySelectorAll('.removeGroup').forEach(b=>b.onclick=()=>b.closest('.group').remove());document.querySelectorAll('.addOption').forEach(b=>b.onclick=()=>{const box=b.previousElementSibling;box.insertAdjacentHTML('beforeend','<div class="option"><input class="oname" placeholder="Nama pilihan"><input class="oprice" type="number" min="0" value="0" placeholder="Tambah harga"><button type="button" class="btn danger removeOption">×</button></div>');bindGroups()});document.querySelectorAll('.removeOption').forEach(b=>b.onclick=()=>b.parentElement.remove())}
async function save(e){e.preventDefault();const option_groups=[...document.querySelectorAll('.group')].map(g=>({name:g.querySelector('.gname').value.trim(),required:g.querySelector('.grequired').checked,options:[...g.querySelectorAll('.option')].map(o=>({name:o.querySelector('.oname').value.trim(),price:Number(o.querySelector('.oprice').value)||0})).filter(o=>o.name)})).filter(g=>g.name&&g.options.length);const row={id:editing.id,name:$('#mname').value.trim(),category:$('#mcat').value.trim(),price:Number($('#mprice').value)||0,image:$('#mimage').value.trim()||null,description:$('#mdesc').value.trim(),active:$('#mactive').checked,option_groups,updated_at:new Date().toISOString()};const{error}=await sb.from('qr_menu_items').upsert(row);if(error){toast(error.message);return}$('#modal').remove();toast('Menu berhasil disimpan');load()}
sb.auth.onAuthStateChange((_e,s)=>s?shell():login());sb.auth.getSession().then(({data})=>data.session?shell():login());
</script></body></html>
